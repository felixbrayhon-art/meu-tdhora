# Cloudflare Pages (alternative host to Vercel). The static app is the Vite build in
# dist/, and functions/ serves /api/* with the same handlers as api/ on Vercel.
name = "meu-tdhora"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Current public address of the FreeLLMAPI tunnel (written by the tunnel start script).
[[kv_namespaces]]
binding = "FREELLMAPI_TUNNEL"
id = "6ed1474877cd455b8780de6724b4e614"

# Private study-material knowledge base (scripts/ingest-fontes.mjs); read only by functions/_lib/fontes.ts.
[[d1_databases]]
binding = "FONTES"
database_name = "todahora-fontes"
database_id = "f5dc2d0a-cbcc-4ff1-8b8f-acfb1648330c"

# Banco de questões reais (scripts/banco-questoes/para-d1.mjs), lido por functions/api/banco.ts. Base
# separada da FONTES de propósito: a FONTES já passa de 200 MB, e o plano grátis tem limite por base.
[[d1_databases]]
binding = "QUESTOES"
database_name = "todahora-questoes"
database_id = "3354c1dc-884e-4745-82a9-354a0dccd164"

# IA da própria Cloudflare (10 mil neurônios/dia grátis). Cota separada do Groq e
# da OpenRouter, e sem chave: o acesso é pelo binding, não por token.
[ai]
binding = "AI"
