
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDAH ORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FDFBF7;
            color: #0A0F1E;
        }
        .gradient-yellow { background: linear-gradient(135deg, #FACC15 0%, #EAB308 100%); }
        .gradient-orange { background: linear-gradient(135deg, #F97316 0%, #EA580C 100%); }
        .gradient-dark { background: linear-gradient(135deg, #0A0F1E 0%, #1A2235 100%); }
        .bg-baby-blue { background-color: #E0F2FE; }
        
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        
        .markdown-body strong {
            font-weight: 700 !important;
            color: #1e293b;
        }
        .markdown-body {
            font-size: 1rem !important;
            line-height: 1.7;
        }
        .markdown-body h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #2563eb;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.25rem;
        }
        .markdown-body p {
            margin-bottom: 1rem;
        }
        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .markdown-body li {
            margin-bottom: 0.5rem;
        }
        
        @keyframes swim {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(2deg); }
            75% { transform: translateY(10px) rotate(-2deg); }
        }
        .animate-swim { animation: swim 3s ease-in-out infinite; }
        
        @keyframes bubble {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
        .bubble { animation: bubble 4s infinite; }
    </style>
